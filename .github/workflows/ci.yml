name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Application quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Validate versions and lockfile
        run: |
          uv lock --check
          uv run python scripts/check_version.py

      - name: Validate repository and Django
        env:
          SECRET_KEY: synthetic-ci-secret-key
          HEVY_ENCRYPTION_KEYS: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: |
          uv run python scripts/security/scan_secrets.py --history
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run ruff check .

      - name: Verify generated frontend assets
        run: |
          npm run build
          git diff --exit-code -- static/css/app.css static/fonts/
          node --check static/js/navigation.js
          node --check static/js/mobile-menu.js
          node --check static/js/sync-actions.js
          node --check static/js/theme.js
          node --check static/js/fitness.js
          node --check static/js/charts.js
          uv run python scripts/check_translations.py

      - name: Run Python tests and coverage gates
        env:
          SECRET_KEY: synthetic-ci-secret-key
          HEVY_ENCRYPTION_KEYS: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: |
          uv run coverage run manage.py test
          uv run coverage report --fail-under=80
          uv run coverage report --include='integrations/*' --fail-under=90
          uv run coverage report --include='analytics/*' --fail-under=90

      - name: Audit dependencies
        run: |
          uv export --locked --no-dev --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from 'pip-audit>=2.7,<3' pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
          npm audit --audit-level=high

      - name: Install browser
        run: npx playwright install --with-deps chrome

      - name: Run isolated browser and static preview tests
        run: |
          npm run test:e2e
          npm run test:preview

      - name: Reproduce local performance corpus
        run: uv run python scripts/benchmark_reference_corpus.py

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
