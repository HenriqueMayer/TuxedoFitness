[project]
name = "tuxedo-fitness"
version = "0.2.0"
description = "A local-first, self-hosted training analytics application built with Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.8,<6.1",
    "cryptography>=46,<52",
    "gunicorn>=23,<27",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["accounts", "analytics", "core", "dashboard", "integrations", "pages", "training", "planning"]
omit = ["*/migrations/*", "*/tests.py", "*/tests/*", "*/tests_*.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
