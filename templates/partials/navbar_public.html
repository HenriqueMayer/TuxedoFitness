{% load static i18n %}
<header class="sticky top-0 z-40 border-b border-forest/10 bg-cream/90 backdrop-blur dark:border-cream/10 dark:bg-night/90">
    <nav class="mx-auto flex min-h-16 w-full max-w-7xl flex-wrap items-center justify-between gap-2 px-4 py-3 sm:h-16 sm:flex-nowrap sm:px-6 sm:py-0 lg:px-8"
         aria-label="{% translate 'Main navigation' %}">
        <a href="{% url 'pages:landing' %}"
           class="flex shrink-0 items-center gap-3">
            <img src="{% static 'brand/tuxedo-fitness-emblem-128.png' %}"
                 alt=""
                 class="h-10 w-10 rounded-xl object-contain">
            <span class="hidden text-left leading-tight sm:block">
                <span class="block text-sm font-medium uppercase tracking-[0.2em]">Tuxedo</span>
                <span class="mt-0.5 block text-xs uppercase tracking-[0.15em] text-caramel-ink dark:text-caramel-light">Fitness</span>
            </span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
            {% include "partials/language_selector.html" %}
            {% include "partials/theme_toggle.html" %}
            <a class="inline-flex items-center rounded-full border border-forest px-5 py-2.5 text-xs font-medium uppercase tracking-widest transition-colors hover:bg-forest hover:text-cream dark:border-cream/50 dark:hover:bg-cream dark:hover:text-night"
               href="{% url 'accounts:login' %}">{% translate "Sign in" %}</a>
            {% if signup_available %}
                <a class="group hidden items-center gap-2 rounded-full bg-caramel px-6 py-2.5 text-xs font-medium uppercase tracking-widest text-forest-deep transition-colors hover:bg-caramel-light sm:inline-flex"
                   href="{% url 'accounts:signup' %}">{% translate "Sign up" %}
                    <svg class="h-4 w-4 transition-transform group-hover:translate-x-1"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2"
                         aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7" />
                    </svg>
                </a>
            {% endif %}
        </div>
    </nav>
</header>
