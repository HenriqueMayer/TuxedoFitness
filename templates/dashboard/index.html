{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <div data-read-surface>
        <div class="mb-7 flex flex-wrap items-end justify-between gap-4">
            <div>
                <p class="eyebrow">{% translate "Your training at a glance" %}</p>
                <h1 class="page-title mt-3">{% translate "Overview" %}</h1>
            </div>
            <a class="btn" href="{% url 'dashboard:reports' %}">{% translate "Explore analysis" %}</a>
        </div>
        <form method="get" class="panel mb-6">
            <div class="grid gap-x-5 sm:grid-cols-2 lg:grid-cols-4">
                {% include "partials/fields.html" with form=period_form %}
            </div>
            <button class="btn">{% translate "Apply filters" %}</button>
        </form>
        {% include "dashboard/_overview_results.html" %}
    </div>
{% endblock %}
